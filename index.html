<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>3D Scan Demo</title>
    <style>
      html,
      body {
        margin: 0;
        padding: 0;
        overflow: hidden;
        font-family: monospace;
        font-size: 14px;
      }

      #ui {
        position: fixed;
        top: 10px;
        left: 10px;
        z-index: 10;
        background: #fff;
        color: #000;
        border: 1px solid #000;
        padding: 8px;
      }

      #ui button {
        display: block;
        width: 100%;
        margin: 0 0 4px 0;
        padding: 4px 8px;
        background: #fff;
        color: #000;
        border: 1px solid #000;
        font: inherit;
        text-align: left;
        cursor: pointer;
      }

      #ui button:last-child {
        margin-bottom: 0;
      }

      #ui button.active {
        background: #000;
        color: #fff;
      }

      #hint {
        margin-top: 6px;
        padding-top: 6px;
        border-top: 1px solid #000;
        font-size: 12px;
      }

      #loading {
        position: fixed;
        top: 10px;
        right: 10px;
        z-index: 10;
        background: #fff;
        color: #000;
        border: 1px solid #000;
        padding: 4px 8px;
        font-family: monospace;
        font-size: 12px;
      }

      /* In-universe label styles */
      .scene-label {
        background: #fff;
        color: #000;
        border: 1px solid #000;
        padding: 2px 6px;
        font-family: monospace;
        font-size: 12px;
        white-space: nowrap;
      }
    </style>

    <script type="importmap">
      {
        "imports": {
          "three": "https://unpkg.com/three@0.128.0/build/three.module.js",
          "three/addons/": "https://unpkg.com/three@0.128.0/examples/jsm/"
        }
      }
    </script>
  </head>

  <body>
    <!-- UI Overlay -->
    <div id="ui">
      <button class="active" data-mode="orbit">Orbit</button>
      <button data-mode="fly">Fly</button>
      <button data-mode="character">Character</button>
      <div id="hint"></div>
    </div>

    <div id="loading">0%</div>

    <script type="module">
      import * as THREE from "three";
      import { OrbitControls } from "three/addons/controls/OrbitControls.js";
      import { PointerLockControls } from "three/addons/controls/PointerLockControls.js";
      import { GLTFLoader } from "three/addons/loaders/GLTFLoader.js";
      import {
        CSS2DRenderer,
        CSS2DObject,
      } from "three/addons/renderers/CSS2DRenderer.js";

      // ============================================================
      // CONSTANTS
      // ============================================================
      const FLY_SPEED = 8;
      const MOVE_SPEED = 6;
      const JUMP_SPEED = 8;
      const GRAVITY = 25;

      const main = () => {
        // ==========================================================
        // SCENE, CAMERA, RENDERERS
        // ==========================================================
        const scene = new THREE.Scene();
        scene.background = new THREE.Color(0xeeeeee);

        const camera = new THREE.PerspectiveCamera(
          75,
          window.innerWidth / window.innerHeight,
          0.1,
          1000
        );
        camera.position.set(0, 1.5, 5);

        const renderer = new THREE.WebGLRenderer({ antialias: true });
        renderer.setSize(window.innerWidth, window.innerHeight);
        renderer.setPixelRatio(window.devicePixelRatio);
        document.body.appendChild(renderer.domElement);

        // CSS2D label renderer (overlay for in-universe labels)
        const labelRenderer = new CSS2DRenderer();
        labelRenderer.setSize(window.innerWidth, window.innerHeight);
        labelRenderer.domElement.style.position = "absolute";
        labelRenderer.domElement.style.top = "0";
        labelRenderer.domElement.style.left = "0";
        labelRenderer.domElement.style.pointerEvents = "none";
        document.body.appendChild(labelRenderer.domElement);

        // ==========================================================
        // LIGHTING
        // ==========================================================
        scene.add(new THREE.AmbientLight(0x404060));

        const directionalLight = new THREE.DirectionalLight(0xffffff, 1);
        directionalLight.position.set(3, 5, 2);
        scene.add(directionalLight);

        const fillLight = new THREE.PointLight(0x4466ff, 0.5);
        fillLight.position.set(-3, 1, 2);
        scene.add(fillLight);

        // ==========================================================
        // GRID
        // ==========================================================
        const gridHelper = new THREE.GridHelper(10, 20, 0x888888, 0x444444);
        gridHelper.material.transparent = true;
        gridHelper.material.opacity = 0.3;
        gridHelper.material.depthWrite = false;
        scene.add(gridHelper);

        // ==========================================================
        // MODEL LOADING
        // ==========================================================
        const loadingEl = document.getElementById("loading");
        const loader = new GLTFLoader();

        loader.load(
          "assets/plush_cat_photoscan.glb",
          (gltf) => {
            const model = gltf.scene;

            // --- Scale to a target size ---
            const box = new THREE.Box3().setFromObject(model);
            const size = box.getSize(new THREE.Vector3());
            const maxDim = Math.max(size.x, size.y, size.z);
            const targetSize = 5;
            const scale = targetSize / maxDim;
            model.scale.setScalar(scale);

            // --- Recenter at origin ---
            const box2 = new THREE.Box3().setFromObject(model);
            const center = box2.getCenter(new THREE.Vector3());
            model.position.sub(center);

            scene.add(model);

            // --- Add in-universe label above the model ---
            const top = box2.max.y - center.y; // model's top in recentered space
            addSceneLabel(model, "Plush Cat Scan", new THREE.Vector3(0, top + 0.4, 0));

            // --- Hide loading indicator ---
            loadingEl.style.display = "none";
          },
          (progress) => {
            if (progress.total > 0) {
              const percent = Math.round(
                (progress.loaded / progress.total) * 100
              );
              loadingEl.textContent = `${percent}%`;
            } else {
              const mb = (progress.loaded / 1048576).toFixed(1);
              loadingEl.textContent = `${mb} MB`;
            }
          },
          (error) => {
            console.error("Failed to load model:", error);
            loadingEl.textContent = "Load failed";
            loadingEl.style.color = "red";
            loadingEl.style.borderColor = "red";
          }
        );

        // Creates a CSS2D label attached to `parent` at local `position`
        function addSceneLabel(parent, text, position) {
          const div = document.createElement("div");
          div.className = "scene-label";
          div.textContent = text;

          const label = new CSS2DObject(div);
          label.position.copy(position);
          parent.add(label);
          return label;
        }

        // ==========================================================
        // CONTROL MODES
        // ==========================================================
        let currentMode = "orbit";

        // --- Orbit ---
        const orbitControls = new OrbitControls(camera, renderer.domElement);
        orbitControls.target.set(0, 0.5, 0);
        orbitControls.enableDamping = true;
        orbitControls.dampingFactor = 0.08;
        orbitControls.update();

        // --- Fly (PointerLock for mouse look + custom WASD) ---
        const flyPointerControls = new PointerLockControls(
          camera,
          renderer.domElement
        );
        const flyMoveState = {
          forward: false,
          backward: false,
          left: false,
          right: false,
          up: false,
          down: false,
          sprint: false,
        };

        // --- Character (PointerLock + WASD + gravity) ---
        const pointerControls = new PointerLockControls(
          camera,
          renderer.domElement
        );
        const player = {
          velocity: new THREE.Vector3(),
          direction: new THREE.Vector3(),
          onGround: true,
          height: 1.6,
        };
        const moveState = {
          forward: false,
          backward: false,
          left: false,
          right: false,
          jump: false,
          sprint: false,
        };

        // ==========================================================
        // MODE SWITCHING
        // ==========================================================
        const buttons = document.querySelectorAll("#ui button");
        const hintEl = document.getElementById("hint");
        const hints = {
          orbit: "Drag to rotate, scroll to zoom, right-drag to pan",
          fly: "Click canvas, then WASD to move, Q/E up/down, Shift to sprint, drag to look",
          character:
            "Click canvas to lock mouse, WASD to move, Shift to run, Space to jump, ESC to release",
        };

        function requestLockForMode(mode) {
          if (mode === "fly" && !flyPointerControls.isLocked) {
            flyPointerControls.lock();
          } else if (mode === "character" && !pointerControls.isLocked) {
            pointerControls.lock();
          }
        }

        function setMode(mode) {
          // Disable all controls and release any active lock
          orbitControls.enabled = false;
          flyPointerControls.enabled = false;
          if (pointerControls.isLocked) pointerControls.unlock();
          if (flyPointerControls.isLocked) flyPointerControls.unlock();

          // Clear movement state so held keys don't carry across modes
          Object.keys(moveState).forEach((k) => (moveState[k] = false));
          Object.keys(flyMoveState).forEach((k) => (flyMoveState[k] = false));

          // Configure the new mode
          if (mode === "orbit") {
            orbitControls.enabled = true;
            orbitControls.update();
          } else if (mode === "fly") {
            flyPointerControls.enabled = true;
          } else if (mode === "character") {
            camera.position.set(0, player.height, 5);
            pointerControls.getObject().position.copy(camera.position);
            player.velocity.set(0, 0, 0);
          }

          currentMode = mode;

          // Update UI
          buttons.forEach((b) =>
            b.classList.toggle("active", b.dataset.mode === mode)
          );
          hintEl.textContent = hints[mode];

          // Auto-lock pointer-based modes (works because we're in a user gesture)
          requestLockForMode(mode);
        }

        buttons.forEach((btn) => {
          btn.addEventListener("click", () => setMode(btn.dataset.mode));
        });

        // ==========================================================
        // POINTER LOCK: click canvas to re-enter locked modes
        // ==========================================================
        renderer.domElement.addEventListener("click", () => {
          if (currentMode === "fly" && !flyPointerControls.isLocked) {
            flyPointerControls.lock();
          } else if (currentMode === "character" && !pointerControls.isLocked) {
            pointerControls.lock();
          }
        });

        // ==========================================================
        // KEYBOARD INPUT
        // ==========================================================
        const onKeyDown = (e) => {
          switch (e.code) {
            // --- Shared movement ---
            case "KeyW":
            case "ArrowUp":
              if (currentMode === "fly") flyMoveState.forward = true;
              else if (currentMode === "character") moveState.forward = true;
              break;
            case "KeyS":
            case "ArrowDown":
              if (currentMode === "fly") flyMoveState.backward = true;
              else if (currentMode === "character") moveState.backward = true;
              break;
            case "KeyA":
            case "ArrowLeft":
              if (currentMode === "fly") flyMoveState.left = true;
              else if (currentMode === "character") moveState.left = true;
              break;
            case "KeyD":
            case "ArrowRight":
              if (currentMode === "fly") flyMoveState.right = true;
              else if (currentMode === "character") moveState.right = true;
              break;

            // --- Vertical movement (fly only) ---
            case "KeyE":
              if (currentMode === "fly") flyMoveState.up = true;
              break;
            case "KeyQ":
              if (currentMode === "fly") flyMoveState.down = true;
              break;

            // --- Jump / fly-up ---
            case "Space":
              if (currentMode === "character") {
                moveState.jump = true;
                e.preventDefault();
              } else if (currentMode === "fly") {
                flyMoveState.up = true;
                e.preventDefault();
              }
              break;

            case "ShiftLeft":
              if (currentMode === "fly") flyMoveState.down = true;
              else if (currentMode === "character") moveState.sprint = true;
              break;

            // --- Mode switching ---
            case "Digit1":
              setMode("orbit");
              break;
            case "Digit2":
              setMode("fly");
              break;
            case "Digit3":
              setMode("character");
              break;
          }
        };

        const onKeyUp = (e) => {
          switch (e.code) {
            case "KeyW":
            case "ArrowUp":
              if (currentMode === "fly") flyMoveState.forward = false;
              else if (currentMode === "character") moveState.forward = false;
              break;
            case "KeyS":
            case "ArrowDown":
              if (currentMode === "fly") flyMoveState.backward = false;
              else if (currentMode === "character") moveState.backward = false;
              break;
            case "KeyA":
            case "ArrowLeft":
              if (currentMode === "fly") flyMoveState.left = false;
              else if (currentMode === "character") moveState.left = false;
              break;
            case "KeyD":
            case "ArrowRight":
              if (currentMode === "fly") flyMoveState.right = false;
              else if (currentMode === "character") moveState.right = false;
              break;

            case "KeyE":
              if (currentMode === "fly") flyMoveState.up = false;
              break;
            case "KeyQ":
              if (currentMode === "fly") flyMoveState.down = false;
              break;

            case "Space":
              if (currentMode === "character") moveState.jump = false;
              else if (currentMode === "fly") flyMoveState.up = false;
              break;

            case "ShiftLeft":
            case "ShiftRight":
              if (currentMode === "fly") flyMoveState.down = false;
              else if (currentMode === "character") moveState.sprint = false;
              break;
          }
        };

        document.addEventListener("keydown", onKeyDown);
        document.addEventListener("keyup", onKeyUp);

        // ==========================================================
        // UPDATE FUNCTIONS
        // ==========================================================
        function updateFly(delta) {
          if (!flyPointerControls.isLocked) return;

          const obj = flyPointerControls.getObject();
          const speed = FLY_SPEED * (flyMoveState.sprint ? 2.5 : 1) * delta;

          const forward = new THREE.Vector3();
          camera.getWorldDirection(forward);
          forward.y = 0;
          forward.normalize();

          const right = new THREE.Vector3();
          right.crossVectors(forward, camera.up).normalize();

          if (flyMoveState.forward) obj.position.addScaledVector(forward, speed);
          if (flyMoveState.backward)
            obj.position.addScaledVector(forward, -speed);
          if (flyMoveState.right) obj.position.addScaledVector(right, speed);
          if (flyMoveState.left) obj.position.addScaledVector(right, -speed);
          if (flyMoveState.up) obj.position.y += speed;
          if (flyMoveState.down) obj.position.y -= speed;
        }

        function updateCharacter(delta) {
          if (!pointerControls.isLocked) return;

          const obj = pointerControls.getObject();
          const speed = MOVE_SPEED * (moveState.sprint ? 2 : 1);

          // Horizontal damping
          player.velocity.x -= player.velocity.x * 10 * delta;
          player.velocity.z -= player.velocity.z * 10 * delta;

          player.direction.z =
            Number(moveState.forward) - Number(moveState.backward);
          player.direction.x =
            Number(moveState.right) - Number(moveState.left);

          if (moveState.forward || moveState.backward)
            player.direction.normalize();
          if (moveState.left || moveState.right) player.direction.normalize();

          if (moveState.forward || moveState.backward)
            player.velocity.z -= player.direction.z * speed * delta * 10;
          if (moveState.left || moveState.right)
            player.velocity.x -= player.direction.x * speed * delta * 10;

          // Jump + gravity
          if (moveState.jump && player.onGround) {
            player.velocity.y = JUMP_SPEED * (moveState.sprint ? 1.3 : 1);
            player.onGround = false;
          }
          player.velocity.y -= GRAVITY * delta;

          pointerControls.moveRight(-player.velocity.x * delta);
          pointerControls.moveForward(-player.velocity.z * delta);

          obj.position.y += player.velocity.y * delta;

          // Ground collision
          if (obj.position.y < player.height) {
            obj.position.y = player.height;
            player.velocity.y = 0;
            player.onGround = true;
          }
        }

        // ==========================================================
        // ANIMATION LOOP
        // ==========================================================
        const clock = new THREE.Clock();

        function animate() {
          requestAnimationFrame(animate);

          const delta = Math.min(clock.getDelta(), 0.1);

          if (currentMode === "orbit") orbitControls.update();
          else if (currentMode === "fly") updateFly(delta);
          else if (currentMode === "character") updateCharacter(delta);

          renderer.render(scene, camera);
          labelRenderer.render(scene, camera);
        }

        animate();

        // ==========================================================
        // RESIZE
        // ==========================================================
        window.addEventListener("resize", () => {
          camera.aspect = window.innerWidth / window.innerHeight;
          camera.updateProjectionMatrix();
          renderer.setSize(window.innerWidth, window.innerHeight);
          labelRenderer.setSize(window.innerWidth, window.innerHeight);
        });

        // ==========================================================
        // INIT
        // ==========================================================
        setMode("orbit");
      };

      main();
    </script>
  </body>
</html>

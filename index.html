<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>3D Scan Demo</title>
    <style>
    html,
      body {
        margin: 0;
        padding: 0;
        overflow: hidden;
        font-family: monospace;
        font-size: 14px;
      }

      #ui {
        position: fixed;
        top: 10px;
        left: 10px;
        z-index: 10;
        background: #fff;
        color: #000;
        border: 1px solid #000;
        padding: 8px;
      }

      #ui button {
        display: block;
        width: 100%;
        margin: 0 0 4px 0;
        padding: 4px 8px;
        background: #fff;
        color: #000;
        border: 1px solid #000;
        font: inherit;
        text-align: left;
        cursor: pointer;
      }

      #ui button:last-child {
        margin-bottom: 0;
      }

      #ui button.active {
        background: #000;
        color: #fff;
      }

      #hint {
        margin-top: 6px;
        padding-top: 6px;
        border-top: 1px solid #000;
        font-size: 12px;
      }
      #loading {
        position: fixed;
        top: 10px;
        right: 10px;
        z-index: 10;
        background: #fff;
        color: #000;
        border: 1px solid #000;
        padding: 4px 8px;
        font-family: monospace;
        font-size: 12px;
      }
    </style>
    <script type="importmap">
      {
        "imports": {
          "three": "https://unpkg.com/three@0.128.0/build/three.module.js",
          "three/addons/": "https://unpkg.com/three@0.128.0/examples/jsm/"
        }
      }
    </script>
  </head>
  <body>
    <!-- UI Overlay -->
    <div id="ui">
      <button class="active" data-mode="orbit">Orbit</button>
      <button data-mode="fly">Fly</button>
      <button data-mode="character">Character</button>
      <div id="hint"> </div>
    </div>
    <div id="loading">0%</div>
    <script type="module" defer>
      import * as THREE from "three";
      import { OrbitControls } from "three/addons/controls/OrbitControls.js";
      import { FlyControls } from "three/addons/controls/FlyControls.js";
      import { PointerLockControls } from "three/addons/controls/PointerLockControls.js";
      import { GLTFLoader } from "three/addons/loaders/GLTFLoader.js";

      

      const main = () => {
        // --- Scene Setup ---
        const scene = new THREE.Scene();
        scene.background = new THREE.Color(0xeeeeee);

        const camera = new THREE.PerspectiveCamera(
          75,
          window.innerWidth / window.innerHeight,
          0.1,
          1000
        );
        camera.position.set(0, 1.5, 5);

        const renderer = new THREE.WebGLRenderer({ antialias: true });
        renderer.setSize(window.innerWidth, window.innerHeight);
        renderer.setPixelRatio(window.devicePixelRatio);
        document.body.appendChild(renderer.domElement);
        /*
        // --- Cube --- 
        const geometry = new THREE.BoxGeometry(1.5, 1.5, 1.5);
        const material = new THREE.MeshStandardMaterial({
          color: 0x44aa88,
          roughness: 0.4,
          metalness: 0.1,
          emissive: new THREE.Color(0x112233),
        });
        const cube = new THREE.Mesh(geometry, material);
        cube.position.y = 0.5;
        scene.add(cube);
        */
      const loadingEl = document.getElementById("loading");
      const loader = new GLTFLoader();
      loader.load(
        "assets/plush_cat_photoscan.glb",
        (gltf) => {
          const model = gltf.scene;
        
          // Measure the model
          const box = new THREE.Box3().setFromObject(model);
          const size = box.getSize(new THREE.Vector3());
          const maxDim = Math.max(size.x, size.y, size.z);
        
          // Scale so the biggest dimension becomes, say, 2 units
          const targetSize = 5;
          const scale = targetSize / maxDim;
          model.scale.setScalar(scale);
      
          // Recenter after scaling
          const box2 = new THREE.Box3().setFromObject(model);
          const center = box2.getCenter(new THREE.Vector3());
          model.position.sub(center);
        
          scene.add(model);

          loadingEl.style.display = "none";
        },
        (progress) => {
        if (progress.total > 0) {
          const percent = Math.round((progress.loaded / progress.total) * 100);
          loadingEl.textContent = `${percent}%`;
        } else {
          // Server didn't send Content-Length; show raw bytes
          const mb = (progress.loaded / 1048576).toFixed(1);
          loadingEl.textContent = `${mb} MB`;
        }
        },
        (error) => {
        console.error("Failed to load model:", error);
        loadingEl.textContent = "Load failed";
        loadingEl.style.color = "red";
        loadingEl.style.borderColor = "red";
        }
      );
       
        // --- Lighting ---
        scene.add(new THREE.AmbientLight(0x404060));

        const directionalLight = new THREE.DirectionalLight(0xffffff, 1);
        directionalLight.position.set(3, 5, 2);
        scene.add(directionalLight);

        const fillLight = new THREE.PointLight(0x4466ff, 0.5);
        fillLight.position.set(-3, 1, 2);
        scene.add(fillLight);

        // --- Grid ---
        const gridHelper = new THREE.GridHelper(10, 20, 0x888888, 0x444444);
        gridHelper.material.transparent = true;
        gridHelper.material.opacity = 0.3;
         gridHelper.material.depthWrite = false;
        scene.add(gridHelper);

        // ============================================================
        // CONTROL MODES
        // ============================================================

        // --- Orbit ---
        const orbitControls = new OrbitControls(camera, renderer.domElement);
        orbitControls.target.set(0, 0.5, 0);
        orbitControls.enableDamping = true;
        orbitControls.dampingFactor = 0.08;
        orbitControls.update();

        // --- Fly ---

        const flyPointerControls = new PointerLockControls(camera, renderer.domElement);

        // Fly movement state
        const flyMoveState = { forward: false, backward: false, left: false, right: false, up: false, down: false };
        const FLY_SPEED = 8;

        // Click canvas to lock in fly mode too
        renderer.domElement.addEventListener("click", () => {
          if (currentMode === "fly" && !flyPointerControls.isLocked) {
            flyPointerControls.lock();
          }
        });




        // --- Character (PointerLock + WASD physics) ---
        const pointerControls = new PointerLockControls(camera, renderer.domElement);

        // Character state
        const player = {
          velocity: new THREE.Vector3(),
          direction: new THREE.Vector3(),
          onGround: true,
          height: 1.6,
        };
        const moveState = { forward: false, backward: false, left: false, right: false, jump: false };
        const MOVE_SPEED = 6;
        const JUMP_SPEED = 8;
        const GRAVITY = 25;

        // --- Mode Switching ---
        let currentMode = "orbit";


        const buttons = document.querySelectorAll("#ui button");
        const hintEl = document.getElementById("hint");
        const hints = {
                  orbit: "Drag to rotate, scroll to zoom, right-drag to pan",
                  fly: "Click canvas, then WASD to move, Q/E up/down, drag to look",
                  character: "Click canvas to lock mouse, WASD to move, Space to jump, ESC to release",
        };
        function requestLockForMode(mode) {
        if (mode === "fly" && !flyPointerControls.isLocked) {
          flyPointerControls.lock();
        } else if (mode === "character" && !pointerControls.isLocked) {
          pointerControls.lock();
        }
      }
        function setMode(mode) {
          // Disable all
          orbitControls.enabled = false;
          flyPointerControls.enabled = false;

          if (pointerControls.isLocked) pointerControls.unlock();

          // Reset camera-ish state per mode
          if (mode === "orbit") {
            orbitControls.enabled = true;
            orbitControls.update();
          } else if (mode === "fly") {
            flyPointerControls.enabled = true;
          } else if (mode === "character") {
            // Place camera at eye height on the ground
            camera.position.set(0, player.height, 5);
            pointerControls.getObject().position.copy(camera.position);
            player.velocity.set(0, 0, 0);
          }

          currentMode = mode;

          // Update UI
          buttons.forEach((b) =>
            b.classList.toggle("active", b.dataset.mode === mode)
          );
          hintEl.textContent = hints[mode];

          requestLockForMode(mode);
        }

        buttons.forEach((btn) => {
          btn.addEventListener("click", () => setMode(btn.dataset.mode));
        });


        // ============================================================
        // CHARACTER INPUT HANDLING
        // ============================================================

        // Pointer lock click-to-enter
        renderer.domElement.addEventListener("click", () => {
          if (currentMode === "character" && !pointerControls.isLocked) {
            pointerControls.lock();
          }
        });

        // Keyboard
const onKeyDown = (e) => {
  switch (e.code) {
    // --- Shared movement keys ---
    case "KeyW":
    case "ArrowUp":
      if (currentMode === "fly") flyMoveState.forward = true;
      else if (currentMode === "character") moveState.forward = true;
      break;

    case "KeyS":
    case "ArrowDown":
      if (currentMode === "fly") flyMoveState.backward = true;
      else if (currentMode === "character") moveState.backward = true;
      break;

    case "KeyA":
    case "ArrowLeft":
      if (currentMode === "fly") flyMoveState.left = true;
      else if (currentMode === "character") moveState.left = true;
      break;

    case "KeyD":
    case "ArrowRight":
      if (currentMode === "fly") flyMoveState.right = true;
      else if (currentMode === "character") moveState.right = true;
      break;

    // --- Fly-only: vertical movement ---
    case "KeyE":
      if (currentMode === "fly") flyMoveState.up = true;
      break;
    case "KeyQ":
      if (currentMode === "fly") flyMoveState.down = true;
      break;

    // --- Character-only: jump ---
    case "Space":
      if (currentMode === "character") {
        moveState.jump = true;
        e.preventDefault();
      }
      if (currentMode === "fly") {
        flyMoveState.up = true;
      }
      break;
    case "ShiftLeft":
      if (currentMode === "fly") {
        flyMoveState.down = true;
      }
      break;
    // --- Mode switching ---
    case "Digit1":
      setMode("orbit");
      break;
    case "Digit2":
      setMode("fly");
      break;
    case "Digit3":
      setMode("character");
      break;
  }
};

const onKeyUp = (e) => {
  switch (e.code) {
    case "KeyW":
    case "ArrowUp":
      if (currentMode === "fly") flyMoveState.forward = false;
      else if (currentMode === "character") moveState.forward = false;
      break;

    case "KeyS":
    case "ArrowDown":
      if (currentMode === "fly") flyMoveState.backward = false;
      else if (currentMode === "character") moveState.backward = false;
      break;

    case "KeyA":
    case "ArrowLeft":
      if (currentMode === "fly") flyMoveState.left = false;
      else if (currentMode === "character") moveState.left = false;
      break;

    case "KeyD":
    case "ArrowRight":
      if (currentMode === "fly") flyMoveState.right = false;
      else if (currentMode === "character") moveState.right = false;
      break;

    case "KeyE":
      if (currentMode === "fly") flyMoveState.up = false;
      break;
    case "KeyQ":
      if (currentMode === "fly") flyMoveState.down = false;
      break;

    case "Space":
      if (currentMode === "character") moveState.jump = false;
      if (currentMode === "fly") {
        flyMoveState.up = false;
      }
      break;
    case "ShiftLeft":
      if (currentMode === "fly") {
        flyMoveState.down = false;
      }
      break;
  }
};	
        document.addEventListener("keydown", onKeyDown);
        document.addEventListener("keyup", onKeyUp);

        // ============================================================
        // ANIMATION LOOP
        // ============================================================
        const clock = new THREE.Clock();

        function animate() {
          requestAnimationFrame(animate);

          const delta = Math.min(clock.getDelta(), 0.1); // clamp for stability

          // --- Update active controls ---
          if (currentMode === "orbit") {
            orbitControls.update();
          } else if (currentMode === "fly") {
            updateFly(delta);
          } else if (currentMode === "character") {
            updateCharacter(delta);
          }


          renderer.render(scene, camera);
        }

        // --- Character physics ---
        function updateCharacter(delta) {
          if (!pointerControls.isLocked) return;

          const obj = pointerControls.getObject();

          // Horizontal movement
          player.velocity.x -= player.velocity.x * 10 * delta;
          player.velocity.z -= player.velocity.z * 10 * delta;

          player.direction.z = Number(moveState.forward) - Number(moveState.backward);
          player.direction.x = Number(moveState.right) - Number(moveState.left);

          if (moveState.forward || moveState.backward) player.direction.normalize();
          if (moveState.left || moveState.right) player.direction.normalize();

          if (moveState.forward || moveState.backward)
            player.velocity.z -= player.direction.z * MOVE_SPEED * delta * 10;
          if (moveState.left || moveState.right)
            player.velocity.x -= player.direction.x * MOVE_SPEED * delta * 10;

          // Vertical / gravity
          if (moveState.jump && player.onGround) {
            player.velocity.y = JUMP_SPEED;
            player.onGround = false;
          }
          player.velocity.y -= GRAVITY * delta;

          pointerControls.moveRight(-player.velocity.x * delta);
          pointerControls.moveForward(-player.velocity.z * delta);

          obj.position.y += player.velocity.y * delta;

          // Ground collision
          if (obj.position.y < player.height) {
            obj.position.y = player.height;
            player.velocity.y = 0;
            player.onGround = true;
          }
        }
function updateFly(delta) {
        if (!flyPointerControls.isLocked) return;

        const obj = flyPointerControls.getObject();
        const speed = FLY_SPEED * delta;

        // Get camera's forward and right vectors (flattened to world Y for horizontal movement)
        const forward = new THREE.Vector3();
        camera.getWorldDirection(forward);
        forward.y = 0;
        forward.normalize();

        const right = new THREE.Vector3();
        right.crossVectors(forward, camera.up).normalize();

        // Apply movement
        if (flyMoveState.forward) obj.position.addScaledVector(forward, speed);
        if (flyMoveState.backward) obj.position.addScaledVector(forward, -speed);
        if (flyMoveState.right) obj.position.addScaledVector(right, speed);
        if (flyMoveState.left) obj.position.addScaledVector(right, -speed);
        if (flyMoveState.up) obj.position.y += speed;
        if (flyMoveState.down) obj.position.y -= speed;
      }
        animate();

        // --- Resize ---
        window.addEventListener("resize", () => {
          camera.aspect = window.innerWidth / window.innerHeight;
          camera.updateProjectionMatrix();
          renderer.setSize(window.innerWidth, window.innerHeight);
        });

        // --- Initialize default mode ---
        setMode("orbit");
      };

      main();
    </script>
  </body>
</html>
